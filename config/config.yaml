hydra:
  run:
    dir: .
  sweep:
    dir: .
    subdir: .
  job_logging:
    root:
      level: INFO

wandb:
  entity: ???
  project: syntheticgraphdata
  group: ???
  log: true

debug: false
save_dir: "exp/${model_pars.hf_model_id}/"

# Experiment parameters
seed: 1
resume: false

model_pars:
  model_dir: ""
  hf_model_id: ???  # Qwen or llama "meta-llama/Llama-3.2-1B-Instruct"
  hf_tokenizer_id: ???

dataset_pars:
  dataset_folder_path: ""
  apply_chat_template: true

# FT parameters
finetuning_pars:
  save_total_limit: 10
  max_eval_datapoints: 1000
  num_train_epochs: 1
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 1
  reference_learning_rate: 1e-6
  lr_scheduler_type: "linear"
  max_completion_length: 192
  max_length: 2048
  save_n_per_epoch: 1
  log_n_per_epoch: 10
  eval_n_per_epoch: 1
  max_eval_examples: 80
  bf16: true
  fp16: false
  deepspeed: ""
  fsdp: ""
  packing: false
  ddp_find_unused_parameters: false
  ddp_static_graph: true
  label_smoothing_factor: 0.0
  warmup_ratio: 0.0
  weight_decay: 0.0
  max_grad_norm: 1.0
  dataloader_num_workers: 1
  dataloader_prefetch_factor: 4
  dataloader_pin_memory: true
  dataloader_persistent_workers: true
  gradient_checkpointing: false

eval_pars:
  num_workers: 1
  pass_at_k: 16
  batch_size: 32
  num_samples: 32
  max_tokens: 1024
  temperature: 0.8
  top_p: 1.0
  top_k: 0
  datasets: ["syllogisms"]
  logging_interval: 100
  tensor_parallel_size: 1
  pipeline_parallel_size: 1
  gpu_memory_utilization: 0.92
  use_train_icl: false
  icl_include_instruct: false
  icl_deduplicate_pairs: false
  dataset_state_path: ""

generate_pars:
  max_to_eval: 1000
  num_workers: 1
  pass_at_k: 4
  num_to_sample: 4
  max_tokens: 1024
  temperature: 0.8
  batch_size: 4
  logging_interval: 100
  best_of: 4
