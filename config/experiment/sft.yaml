# @package _global_

wandb:
  entity: ???
  group: "sft"
  log: true

seed: 1

model_pars:
  model_dir: ""
  hf_model_id: "Qwen/Qwen3-4B-Instruct-2507"
  hf_tokenizer_id: "Qwen/Qwen3-4B-Instruct-2507"

resume: false
method: "SFT"

dataset_pars:
  dataset_folder_path: "simple_graph_data"
  apply_chat_template: true

finetuning_pars:
  save_n_per_epoch: 0
  num_train_epochs: 1
  save_total_limit: 0
  max_length: 200
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 8
  eval_n_per_epoch: 10
  log_n_per_epoch: 100
  packing: false
  label_smoothing_factor: 0.0
  warmup_ratio: 0.03
  reference_learning_rate: 2e-5
  weight_decay: 0.01
  max_grad_norm: 1.0
  deepspeed: ""

eval_pars:
  num_workers: 1
  max_to_eval: 100
  temperature: 0.3
  pass_at_k: 1
  num_samples: 16
  max_tokens: 200
  batch_size: 32
  tensor_parallel_size: 1
  pipeline_parallel_size: 1
  data_parallel_size: 1
  gpu_memory_utilization: 0.90
